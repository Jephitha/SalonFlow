plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.gms.google-services"
}

def readVersionCode() {
    def props = new Properties()
    file("version.properties").withInputStream { props.load(it) }
    (props["VERSION_CODE"] as String).toInteger()
}
def readVersionName() {
    def props = new Properties()
    file("version.properties").withInputStream { props.load(it) }
    props["VERSION_NAME"] as String
}

tasks.matching { it.name.startsWith("assembleRelease") }.configureEach {
    doFirst {
        def props = new Properties()
        file("version.properties").withInputStream { props.load(it) }
        def code = (props["VERSION_CODE"] as String).toInteger() + 1
        def name = props["VERSION_NAME"] as String
        def parts = name.split("\\.")
        def minor = (parts.length > 1 ? parts[1].toInteger() : 0) + 1
        props["VERSION_CODE"] = String.valueOf(code)
        props["VERSION_NAME"] = parts[0] + "." + String.valueOf(minor)
        file("version.properties").withOutputStream { props.store(it, "Auto-incremented by build") }
        println "Next build will be " + props["VERSION_NAME"] + " (code " + props["VERSION_CODE"] + ")"
    }
}

android {
    namespace = "com.salonflow.app"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.salonflow.app"
        minSdk = 23
        targetSdk = 36
        versionCode = readVersionCode()
        versionName = readVersionName()
    }

    signingConfigs {
        release {
            storeFile = file("salonflow-release.keystore")
            storePassword = System.getenv("KEYSTORE_PASSWORD")
            keyAlias = "salonflow"
            keyPassword = System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".dev"
        }
        release {
            debuggable = false
            minifyEnabled = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig = signingConfigs.release
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.12.0")
    implementation "com.google.firebase:firebase-firestore"
